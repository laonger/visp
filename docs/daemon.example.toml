# =============================================================================
# visp daemon 配置模板
# =============================================================================
# 放置位置： ~/.config/visp/daemon.toml
#
# 所有字段均有默认值，不创建此文件也能正常运行。
# 此模板列出了所有可配置项及其默认值，按需取消注释修改即可。
# =============================================================================

# ---------------------------------------------------------------------------
# [daemon] — 守护进程自身配置
# ---------------------------------------------------------------------------
[daemon]
# gRPC 监听地址
# listen_addr = "[::1]:50051"

# 日志级别: trace, debug, info, warn, error
# log_level = "info"

# ---------------------------------------------------------------------------
# [llm] — 大语言模型配置
# ---------------------------------------------------------------------------
# 使用 [[llm.models]] 配置多个模型，在 CLI 中用 /model 切换。
# ---------------------------------------------------------------------------

[llm]
# 预设模型（格式 {provider}/{name}），缺省时使用 models 第一个
# default = "Anthropic/Claude Sonnet"

[[llm.models]]
name = "Claude Sonnet"
provider = "Anthropic"
protocol = "anthropic"
model = "claude-sonnet-4-20250514"
# api_key 缺省时依次尝试: 字段 api_key → 环境变量 ANTHROPIC_API_KEY
# api_key = "${ANTHROPIC_API_KEY}"
temperature = 0.3
max_tokens = 8192
max_context_tokens = 128000
# Claude thinking 模式预算 token（仅 anthropic 协议有效）
# thinking_budget_tokens = 2048

[[llm.models]]
name = "GPT-4o"
provider = "OpenAI"
protocol = "openai"
model = "gpt-4o"
api_key = "${OPENAI_API_KEY}"
# base_url = "https://api.openai.com/v1"
temperature = 0.3
max_tokens = 16384
max_context_tokens = 128000

# ---------------------------------------------------------------------------
# [tools] — 工具全局配置
# ---------------------------------------------------------------------------
[tools]
# bash 命令超时时间（秒）
# bash_timeout_secs = 120

# 读文件大小限制（字节），默认 1MB
# file_max_size_bytes = 1048576

# ---------------------------------------------------------------------------
# [agent] — Agent 循环配置
# ---------------------------------------------------------------------------
[agent]
# 软上限：达到此轮次后在 LLM 调用前注入"请收尾"提示，由模型自主决定何时结束
# 设为 0 表示关闭软上限，依赖硬上限兜底
# 兼容旧字段名 max_iterations（二者等价）
# soft_limit = 50

# 连续相同工具调用的 doom_loop 检测窗口（0 = 关闭）
# doom_loop_threshold = 5

# LLM 调用失败时的重试次数
# llm_retry_attempts = 3

# 重试基础延迟（毫秒），每次重试会指数退避
# llm_retry_base_delay_ms = 1000

# bash 执行前是否需要用户确认
# true=安全模式（推荐），false=静默执行
# bash_confirm_mode = true

# 工具可操作文件大小限制（字节）
# file_max_size_bytes = 1048576

# ---------------------------------------------------------------------------
# 内置 Agent 覆盖配置
# ---------------------------------------------------------------------------
# visp 内置了 default、code_reader、explorer、fixer 四个 agent。
# 通过 [[agent.builtin]] 可以在不修改源码的情况下覆盖内置 agent 的
# model / temperature / steps。
#
# 优先级：内置定义 < [[agent.builtin]] 配置 < ~/.config/visp/agents/*.md < .visp/agents/*.md
#
# model 格式：{provider}/{name} 或 {provider}/{model}
#   如 "Opencode/deepseek-v4-flash" 或 "Anthropic/Claude Sonnet"
# 未指定 model 的内置 agent 会继承 session 默认模型。
#
# [[agent.builtin]]
# name = "explorer"
# model = "Opencode/deepseek-v4-flash"
# temperature = 0.1
#
# [[agent.builtin]]
# name = "fixer"
# model = "Opencode/deepseek-v4-flash"
# temperature = 0.2
# steps = 30

# ---------------------------------------------------------------------------
# [observability] — 日志、Trace、Metrics 观测配置
# ---------------------------------------------------------------------------
[observability]
# 是否启用 observability 初始化。关闭后不会安装 tracing subscriber，也不会导出 OTLP。
# enabled = true

# tracing 过滤级别；也可用 RUST_LOG 环境变量覆盖。
# level = "info"

# 控制台/文件日志格式：json 或 pretty。
# format = "json"

# 是否启用跨异步任务的父子 span 关联。
# parent_link = true

# 是否保留内部 metrics summary 句柄。
# metrics_summary = true

# 可选：日志目录。设置后按天滚动写入 visp-daemon.log；不设置则输出到 stdout。
# 默认：~/.visp/logs
# log_file = "~/.visp/logs"

# ----- OpenTelemetry / OTLP -----
[observability.otlp]
# 是否通过 OTLP 导出 trace。
# enabled = false

# OTLP Collector/后端地址。当前实现使用 OTLP/gRPC，通常端口为 4317。
# endpoint = "http://localhost:4317"

# 协议字段；当前建议使用 grpc。
# protocol = "grpc"

# OTLP 导出超时时间（秒）。
# timeout_secs = 10

# Trace 采样率，范围 0.0 ~ 1.0；超出范围会被夹到有效区间。
# sample_rate = 1.0

# 可选：OTLP headers，常用于鉴权。
# [observability.otlp.headers]
# Authorization = "Bearer your-token"

# ----- Langfuse -----
# 在 span 上设置 Langfuse 语义字段，用于 Langfuse 关联 trace/session/用户/tag。
# 这些字段是 Langfuse 标准属性，非 OTel 原生属性，由 tracing 字段注入。
# langfuse.session.id 由 daemon 根据当前 session 自动填充。
#
# 此配置仅控制 visp 写入的 Langfuse 语义字段，不包含 Langfuse 连接配置。
# Langfuse 连接（endpoint/public key/secret key）属于 OpenTelemetry Collector
# 配置，而非 visp 配置。参考 Collector 配置见 docs/otel-collector-langfuse.example.yaml。
# visp 不管理 Collector 进程；Collector 示例仅为参考，不代表 visp 管理 Collector。
#
# [observability.langfuse]
# enabled = true
# user_id = "user_456"
# tags = ["agent", "weather"]
# environment = "production"
# release = "1.0.0"
# version = "abc123"
# public = true
#
# [observability.langfuse.metadata]
# env = "prod"
# count = 42
#
# [observability.langfuse.capture]
# input = false
# output = false

# =============================================================================
# [tool.*] — 各工具的 per-tool 配置
# =============================================================================
# 所有工具现在都支持通过 [tool.<工具名>] 段独立配置。
# 具体支持字段见下方各段说明。
# =============================================================================

# ----- bash -----
# Shell 命令执行工具
[tool.bash]
# 附加的黑名单命令（在硬编码黑名单之上追加）
# hardcoded 黑名单始终生效: sudo, rm -rf /, chmod 777, chmod 7777
# 硬编码破坏性命令检测始终生效: rm, rmdir, del, dd, format, mkfs, > 等
# blocked_commands = ["docker stop", "systemctl"]

# 默认超时（秒），调用未指定 timeout 时使用
# default_timeout_secs = 120

# 输出截断大小（字节）
# max_output_bytes = 102400

# ----- read_file -----
# 文件读取工具
[tool.read_file]
# 文件大小限制（字节）
# max_file_size = 1048576

# ----- write_file -----
# 文件写入工具（默认无需审批）
[tool.write_file]
# 文件大小限制（字节，仅兼容，当前不使用）
# max_file_size = 1048576

# 是否要求用户审批（默认 false，项目目录内写文件无需确认）
# require_approval = false

# ----- edit_file -----
# 文件精确替换编辑工具（默认无需审批）
[tool.edit_file]
# 文件大小限制（字节）
# max_file_size = 1048576

# 是否要求用户审批（默认 false，项目目录内编辑文件无需确认）
# require_approval = false

# ----- grep -----
# 内容搜索工具（支持正则）
[tool.grep]
# 搜索超时（秒）
# timeout_secs = 30

# 额外排除目录（在硬编码排除列表之上追加）
# hardcoded 排除始终生效: .git, node_modules, target, .venv, __pycache__, dist, build
# exclude_dirs = ["vendor", ".cache"]

# ----- glob -----
# 文件名搜索工具（支持通配符）
[tool.glob]
# 搜索超时（秒）
# timeout_secs = 30

# ----- webfetch -----
# 网络抓取工具
[tool.webfetch]
# 允许访问的域名白名单（空 = 需要用户确认）
# allow_domains = ["docs.rs", "crates.io", "github.com"]

# 请求超时（秒，上限 120）
# timeout_secs = 30

# =============================================================================
# [mcp] — MCP 服务器配置
# =============================================================================
# MCP（Model Context Protocol）服务器配置项。
# Daemon 启动时会自动连接列出的服务器，将提供的工具集成到 Tool Registry 中，
# Agent 循环即可一视同仁调用。
#
# 支持两种传输方式：
#   stdio — 以子进程方式启动 MCP 服务器（如 npx、uvx 命令）
#   sse   — HTTP SSE 方式连接已运行的 MCP 服务器
#
# 每项可选字段：
#   enabled             — 是否自动连接（默认 true）
#   tool_prefix         — 工具名前缀，防止不同服务器工具名冲突（默认无前缀）
#   tool_timeout_secs   — 工具调用超时（秒，默认 60）
# =============================================================================

# ----- stdio 示例（npx 启动 Playwright MCP 服务器） -----
# [[mcp.servers]]
# name = "playwright"
# transport = { type = "stdio", command = "npx", args = ["@anthropic-ai/mcp-playwright"] }
# tool_timeout_secs = 120

# ----- stdio 示例（uvx 启动 fetch MCP 服务器） -----
# [[mcp.servers]]
# name = "fetch"
# transport = { type = "stdio", command = "uvx", args = ["mcp-server-fetch"] }

# ----- stdio 示例（自定义脚本 + API Key） -----
# API Key 通过 env 传入环境变量，子进程继承 daemon 环境 + 此处叠加/覆盖
# [[mcp.servers]]
# name = "custom-script"
# transport = { type = "stdio", command = "python", args = ["server.py"], env = { API_KEY = "sk-xxx" } }

# ----- SSE 示例（连接已运行的 MCP HTTP 服务器） -----
# API Key 通过 headers 传入 HTTP 请求头
# [[mcp.servers]]
# name = "custom-api"
# transport = { type = "sse", url = "http://localhost:8080/mcp", headers = { Authorization = "Bearer sk-xxx" } }
# tool_prefix = "custom_"
