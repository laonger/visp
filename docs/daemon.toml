# visp-daemon 配置文件
# 路径：~/.config/visp/daemon.toml
# 所有字段均有默认值，可按需覆盖

# ─── Daemon 基本设置 ────────────────────────────────────────────
[daemon]
# 监听地址，默认仅本地回环
listen_addr = "[::1]:50051"

# 日志级别
# trace / debug / info / warn / error
log_level = "info"


# ─── LLM 配置 ───────────────────────────────────────────────────
[llm]
# 提供器类型（当前仅支持 anthropic）
provider = "anthropic"

# 模型名称
# Anthropic: claude-sonnet-4-20250514, claude-3-7-sonnet-20250219, claude-3-5-haiku-20241022
# 通过 base_url 兼容 OpenAI 接口时：gpt-5, gpt-4o 等
model = "claude-sonnet-4-20250514"

# API Key（或设置 ANTHROPIC_API_KEY 环境变量）
api_key = "sk-ant-..."

# 自定义 API 地址（兼容第三方代理或 OpenAI 接口）
# 默认：https://api.anthropic.com
base_url = ""

# 温度参数（0.0 ~ 2.0，默认 0.7）
temperature = 0.7

# 最大输出 token 数
max_tokens = 4096

# 上下文窗口大小（effective limit，已含输出预留）
# 内置模型对照表：Claude Sonnet 7 → 128K, DeepSeek-V3 → 102K, GPT-5 → 102K
max_context_tokens = 128000

# Claude thinking 模式预算 token 数
# 启用后 LLM 可在响应前使用思考块，0 或省略则不启用
thinking_budget_tokens = 2048


# ─── 工具通用设置 ──────────────────────────────────────────────
[tools]
# Bash 超时（秒）
bash_timeout_secs = 120

# 文件读写最大字节数
file_max_size_bytes = 1048576  # 1MB


# ─── Agent 编排设置 ─────────────────────────────────────────────
[agent]
# 最大迭代轮数（防止无限循环）
max_iterations = 50

# LLM 调用重试次数（网络错误/速率限制时指数退避）
llm_retry_attempts = 3

# 重试基础延迟（毫秒，每次翻倍）
llm_retry_base_delay_ms = 1000

# Bash 确认模式：true 则危险命令（rm/dd/> 等）需用户确认
bash_confirm_mode = true

# 文件读写最大字节数（覆盖 tools.file_max_size_bytes）
file_max_size_bytes = 1048576


# ─── 工具级配置 ────────────────────────────────────────────────
[tool.webfetch]
# WebFetch 白名单域名，命中后自动放行（不弹审批）
# 项目级白名单可放在 .visp/webfetch.toml
allow_domains = ["github.com", "docs.rs", "crates.io"]
