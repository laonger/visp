# =============================================================================
# visp daemon 配置模板
# =============================================================================
# 放置位置： ~/.config/visp/daemon.toml
#
# 所有字段均有默认值，不创建此文件也能正常运行。
# 此模板列出了所有可配置项及其默认值，按需取消注释修改即可。
# =============================================================================

# ---------------------------------------------------------------------------
# [daemon] — 守护进程自身配置
# ---------------------------------------------------------------------------
[daemon]
# gRPC 监听地址
# listen_addr = "[::1]:50051"

# 日志级别: trace, debug, info, warn, error
# log_level = "info"

# ---------------------------------------------------------------------------
# [llm] — 大语言模型配置
# ---------------------------------------------------------------------------
[llm]
# 提供商: "anthropic"（默认）、"openai"、"ollama"、"custom"
# provider = "anthropic"

# 模型名称
# model = "claude-3-7-sonnet-20250219"

# 生成温度 (0.0 ~ 1.0)
# temperature = 0.7

# 最大输出 token 数
# max_tokens = 4096

# API Key
# 建议通过环境变量设置，也可直接写入此处
# api_key = "sk-ant-xxxxxxxxxxxx"

# 自定义 API 地址（用于代理或兼容 API 的第三方服务）
# base_url = "https://api.anthropic.com"

# Claude thinking 模式预算 token 数
# 启用后 Claude 会在回答前进行深度思考，适合复杂推理任务
# thinking_budget_tokens = 2048

# ---------------------------------------------------------------------------
# [tools] — 工具全局配置
# ---------------------------------------------------------------------------
[tools]
# bash 命令超时时间（秒）
# bash_timeout_secs = 120

# 读文件大小限制（字节），默认 1MB
# file_max_size_bytes = 1048576

# ---------------------------------------------------------------------------
# [agent] — Agent 循环配置
# ---------------------------------------------------------------------------
[agent]
# 单次任务最大迭代次数（防止无限循环）
# max_iterations = 50

# LLM 调用失败时的重试次数
# llm_retry_attempts = 3

# 重试基础延迟（毫秒），每次重试会指数退避
# llm_retry_base_delay_ms = 1000

# bash 执行前是否需要用户确认
# true=安全模式（推荐），false=静默执行
# bash_confirm_mode = true

# 工具可操作文件大小限制（字节）
# file_max_size_bytes = 1048576

# =============================================================================
# [tool.*] — 各工具的 per-tool 配置
# =============================================================================
# 所有工具现在都支持通过 [tool.<工具名>] 段独立配置。
# 具体支持字段见下方各段说明。
# =============================================================================

# ----- bash -----
# Shell 命令执行工具
[tool.bash]
# 附加的黑名单命令（在硬编码黑名单之上追加）
# hardcoded 黑名单始终生效: sudo, rm -rf /, chmod 777, chmod 7777
# 硬编码破坏性命令检测始终生效: rm, rmdir, del, dd, format, mkfs, > 等
# blocked_commands = ["docker stop", "systemctl"]

# 默认超时（秒），调用未指定 timeout 时使用
# default_timeout_secs = 120

# 输出截断大小（字节）
# max_output_bytes = 102400

# ----- read_file -----
# 文件读取工具
[tool.read_file]
# 文件大小限制（字节）
# max_file_size = 1048576

# ----- write_file -----
# 文件写入工具
[tool.write_file]
# 文件大小限制（字节，仅兼容，当前不使用）
# max_file_size = 1048576

# ----- edit_file -----
# 文件精确替换编辑工具
[tool.edit_file]
# 文件大小限制（字节）
# max_file_size = 1048576

# ----- grep -----
# 内容搜索工具（支持正则）
[tool.grep]
# 搜索超时（秒）
# timeout_secs = 30

# 额外排除目录（在硬编码排除列表之上追加）
# hardcoded 排除始终生效: .git, node_modules, target, .venv, __pycache__, dist, build
# exclude_dirs = ["vendor", ".cache"]

# ----- glob -----
# 文件名搜索工具（支持通配符）
[tool.glob]
# 搜索超时（秒）
# timeout_secs = 30

# ----- webfetch -----
# 网络抓取工具
[tool.webfetch]
# 允许访问的域名白名单（空 = 需要用户确认）
# allow_domains = ["docs.rs", "crates.io", "github.com"]

# 请求超时（秒，上限 120）
# timeout_secs = 30
