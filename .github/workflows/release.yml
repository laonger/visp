name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ""

          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ""

    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Build release
        run: cargo build --release --workspace --target ${{ matrix.target }}
        env:
          CARGO_TERM_COLOR: always

      - name: Package binaries
        run: |
          mkdir -p visp-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/visp        visp-${{ matrix.target }}/
          cp target/${{ matrix.target }}/release/visp-daemon visp-${{ matrix.target }}/
          cp target/${{ matrix.target }}/release/visp-cli    visp-${{ matrix.target }}/
          tar czf visp-${{ matrix.target }}.tar.gz visp-${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: visp-${{ matrix.target }}
          path: visp-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release with tag annotation as body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Read tag annotation into notes file
          git for-each-ref --format='%(contents)' "refs/tags/${{ github.ref_name }}" > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            git tag -n99 "${{ github.ref_name }}" | sed 's/^[^[:space:]]*[[:space:]]*//' > /tmp/notes.md
          fi
          # Create release with --notes-file; --generate-notes fills in if file is empty
          if [ -s /tmp/notes.md ]; then
            gh release create "${{ github.ref_name }}" artifacts/* --notes-file /tmp/notes.md
          else
            gh release create "${{ github.ref_name }}" artifacts/* --generate-notes
          fi
