name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ""

          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ""

    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Build release
        run: cargo build --release --workspace --target ${{ matrix.target }}
        env:
          CARGO_TERM_COLOR: always

      - name: Package binaries
        run: |
          mkdir -p visp-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/visp        visp-${{ matrix.target }}/
          cp target/${{ matrix.target }}/release/visp-daemon visp-${{ matrix.target }}/
          cp target/${{ matrix.target }}/release/visp-cli    visp-${{ matrix.target }}/
          tar czf visp-${{ matrix.target }}.tar.gz visp-${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: visp-${{ matrix.target }}
          path: visp-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Write tag annotation to body file
        run: |
          # Ensure annotated tag object is fetched (actions/checkout may not fetch it)
          git fetch --tags --force origin "${{ github.ref }}"
          # Read tag annotation; fall back to tag -n99 if %(contents) is empty
          git for-each-ref --format='%(contents)' "refs/tags/${{ github.ref_name }}" > body.md
          if [ ! -s body.md ]; then
            git tag -n99 "${{ github.ref_name }}" | sed 's/^[^[:space:]]*[[:space:]]*//' > body.md
          fi
          if [ ! -s body.md ]; then
            echo "empty_body=true" >> "$GITHUB_ENV"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: body.md
          generate_release_notes: ${{ env.empty_body == 'true' }}
