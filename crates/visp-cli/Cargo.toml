[package]
name = "visp-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
visp-proto = { path = "../visp-proto" }
visp-command = { path = "../visp-command" }
tonic = { workspace = true, features = ["transport"] }
prost.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
futures.workspace = true
tokio-stream.workspace = true
clap = { version = "4", features = ["derive"] }
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
ratatui-textarea = "0.9"
chrono = { version = "0.4", features = ["clock"] }
serde_json = "1"
regex = "1"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
ratatui-markdown = { version = "0.3", default-features = false, features = ["markdown"] }
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
reqwest = { workspace = true }
unicode-width = "0.2"
