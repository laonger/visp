syntax = "proto3";
package visp;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// ============ Session ============
message Session {
    string session_id = 1;
    SessionStatus status = 2;
    string project_path = 3;
    google.protobuf.Timestamp created_at = 4;
    string model = 5;
    string last_user_message = 6;
    repeated string available_models = 7;
}

enum SessionStatus {
    IDLE = 0;
    RUNNING = 1;
    COMPLETED = 2;
    ERROR = 3;
}

message LlmConfig {
    optional string model = 1;
    optional double temperature = 2;
    optional uint32 max_tokens = 3;
    map<string, string> extra = 4;
    optional uint32 max_context_tokens = 5;
}

message CreateSessionRequest {
    string project_path = 1;
    LlmConfig config = 2;
}

message ListSessionsResponse {
    repeated Session sessions = 1;
}

message DeleteSessionRequest {
    string session_id = 1;
}

message GetSessionRequest {
    string session_id = 1;
}

// ============ Chat (双向流) ============
message JoinSession {
    string session_id = 1;
}

message ClientMessage {
    oneof payload {
        UserInput user_input = 1;
        ConfigUpdate config_update = 2;
        UserResponse user_response = 3;
        Cancel cancel = 4;
        Ack ack = 5;
        JoinSession join_session = 6;
    }
}

message UserInput {
    string text = 1;
    string session_id = 2;
    string request_id = 3;
}

message Ack {
    string request_id = 1;
}

message ConfigUpdate {
    string session_id = 1;
    LlmConfig config = 2;
}

message UserResponse {
    string query_id = 1;
    int32 selected_index = 2; // 选中项索引；-1 = Other 自定义输入
    string text = 3;          // 自定义文本（selected_index==-1 时使用）
}

message UserQuery {
    string query_id = 1;
    string message = 2;
    string session_id = 3;
    repeated string options = 4;  // LLM 提供选项；空列表 = 工具审批模式
    bool allow_other = 5;        // 是否显示 Other 按钮
}

message ThinkingBlock {
    string thinking = 1;
    string signature = 2;
    string session_id = 3;
}

message ServerMessage {
    oneof payload {
        TextDelta text_delta = 1;
        ToolCall tool_call = 2;
        ToolResult tool_result = 3;
        StatusUpdate status_update = 4;
        Error error = 5;
        Done done = 6;
        UserQuery user_query = 7;
        ThinkingBlock thinking_block = 8;
        UsageInfo usage_info = 9;
    }
}

message TextDelta {
    string delta = 1;
    string session_id = 2;
}

message ToolCall {
    string call_id = 1;
    string tool_name = 2;
    string arguments = 3; // JSON string
    string session_id = 4;
}

message ToolResult {
    string call_id = 1;
    string content = 2;
    bool is_error = 3;
    string session_id = 4;
    string tool_name = 5;
}

message StatusUpdate {
    string message = 1;
    string session_id = 2;
    repeated string user_inputs = 3;
}

message Error {
    string code = 1;
    string message = 2;
    string session_id = 3;
}

message UsageInfo {
    uint32 input_tokens = 1;
    uint32 output_tokens = 2;
    uint32 tool_calls = 3;
    string session_id = 4;
    uint32 cache_creation_input_tokens = 5;
    uint32 cache_read_input_tokens = 6;
}

message Done {
    string session_id = 1;
}

message Cancel {
    string session_id = 1;
}

// ============ File ============
message ReadFileRequest {
    string path = 1;
    string session_id = 2;
    optional int32 start_line = 3;
    optional int32 end_line = 4;
}

message ReadFileResponse {
    string content = 1;
    string path = 2;
}

// ============ CodeGraph ============
message SearchSymbolsRequest {
    string query = 1;
    string project_path = 2;
    int32 limit = 3;
}

message SymbolInfo {
    string name = 1;
    string kind = 2;
    string file_path = 3;
    uint32 line = 4;
    uint32 column = 5;
    string signature = 6;
}

message SearchSymbolsResponse {
    repeated SymbolInfo symbols = 1;
}

message GetSymbolDetailsRequest {
    string symbol_name = 1;
    string project_path = 2;
}

message SymbolDetails {
    string name = 1;
    string kind = 2;
    string file_path = 3;
    uint32 line = 4;
    uint32 column = 5;
    string signature = 6;
    string docstring = 7;
    string source = 8;
    repeated string callers = 9;
    repeated string callees = 10;
}

// ============ Daemon ============
message HealthStatus {
    bool alive = 1;
    string version = 2;
    uint64 uptime_seconds = 3;
}

message ShutdownRequest {
    bool force = 1;
}

// ============ Service ============
service CoderDaemon {
    // Session management
    rpc CreateSession(CreateSessionRequest) returns (Session);
    rpc ListSessions(google.protobuf.Empty) returns (ListSessionsResponse);
    rpc DeleteSession(DeleteSessionRequest) returns (google.protobuf.Empty);
    rpc GetSession(GetSessionRequest) returns (Session);

    // Core conversation (bidirectional streaming)
    rpc Chat(stream ClientMessage) returns (stream ServerMessage);

    // Fast file access
    rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);

    // Code intelligence
    rpc SearchSymbols(SearchSymbolsRequest) returns (SearchSymbolsResponse);
    rpc GetSymbolDetails(GetSymbolDetailsRequest) returns (SymbolDetails);

    // Daemon control
    rpc HealthCheck(google.protobuf.Empty) returns (HealthStatus);
    rpc Shutdown(ShutdownRequest) returns (google.protobuf.Empty);
}
