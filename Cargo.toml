[workspace]
resolver = "2"
members = [
    "crates/vbw-cli",
    "crates/vbw-codegraph",
    "crates/vbw-core",
    "crates/vbw-daemon",
    "crates/vbw-llm",
    "crates/vbw-proto",
    "crates/vbw-tools",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/laonger/vibewisp"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.13"
prost = "0.13"
prost-types = "0.13"
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
bytes = "1"
futures = "0.3"
notify = { version = "7", features = ["macos_kqueue"] }
