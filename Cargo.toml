[workspace]
resolver = "2"
members = [
    "crates/visp",
    "crates/visp-cli",
    "crates/visp-codegraph",
    "crates/visp-context",
    "crates/visp-core",
    "crates/visp-daemon",
    "crates/visp-llm",
    "crates/visp-proto",
    "crates/visp-tools",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/laonger/visp"

[workspace.dependencies]
chrono = { version = "0.4", features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.13"
prost = "0.13"
prost-types = "0.13"
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
bytes = "1"
futures = "0.3"
notify = { version = "7", features = ["macos_kqueue"] }
